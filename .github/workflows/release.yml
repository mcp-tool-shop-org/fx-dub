# Publish to PyPI via Trusted Publishing (OIDC).
#
# This file's NAME, the environment NAME, and the repository must match the
# pending publisher registered on PyPI exactly:
#
#     Repository:       mcp-tool-shop-org/fx-dub
#     Workflow:         release.yml
#     Environment name: release
#
# Rename any of the three and PyPI will refuse to mint a token, with an error
# that does not obviously point at the mismatch. Do not "tidy" them.
#
# No long-lived token exists anywhere: no PYPI_API_TOKEN secret, nothing in the
# org secret store. `id-token: write` lets the job exchange a short-lived
# GitHub OIDC assertion for a scoped PyPI token at publish time.
name: release

# Release-only trigger, per the org's Actions rules: never on push. The tag is
# cut and the GitHub Release published first; that event drives the upload, so
# the artifact always corresponds to a real, immutable release.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      # The gate runs again here rather than trusting the CI run on the merge
      # commit: a release can be cut from any ref, and a wheel that fails its
      # own smoke test must never reach the index.
      - name: Verify before building
        run: |
          chmod +x verify.sh
          ./verify.sh

      - name: Check distribution metadata
        run: python -m twine check dist/*

      # The version in the manifest must equal the tag, or the release page and
      # the index disagree forever. Fail loudly here, before publishing.
      - name: Version matches tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG manifest=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != pyproject version $VER"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
