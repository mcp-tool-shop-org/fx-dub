name: ci

# Paths-gated, per the org's Actions rules: CI minutes are finite and this repo
# carries large run artifacts that must never trigger a build.
#
# ONE RUN PER COMMIT. `push` is scoped to the default branch because an
# unrestricted push trigger fires a SECOND full matrix alongside `pull_request`
# on a PR branch, and a THIRD on the tag at release time — the tag and the main
# push carry the same SHA. Measured 2026-09-14: five duplicate-SHA pairs in the
# visible run history (4 × main+tag, 1 × push+pull_request).
#
# The previous attempt fixed this in the concurrency group and could not work:
# `github.head_ref` is empty on a push, so the two events resolved to different
# group names, and the main/tag pair runs minutes apart where cancel-in-progress
# never applies at all. The duplicate has to be removed at the trigger — a run
# that is queued and then cancelled has already spent minutes.
#
# Consequence, deliberately accepted: a branch with no open PR gets no automatic
# run. Use `workflow_dispatch`, or open the PR.
on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'tools/**'
      - 'kb/**'
      - 'tests/**'
      - 'workflows/**'
      - 'docs/scenes/**'
      - 'docs/assets/**'
      - 'verify.sh'
      - '.github/workflows/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'tools/**'
      - 'kb/**'
      - 'tests/**'
      - 'workflows/**'
      - 'docs/scenes/**'
      - 'docs/assets/**'
      - 'verify.sh'
      - '.github/workflows/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
  workflow_dispatch:

concurrency:
  # Keyed on the BARE BRANCH NAME, and on a ref rather than a SHA.
  #
  # Ref, not SHA: this is what cancels a SUPERSEDED commit's run when you push
  # again to the same branch — the saving that actually recurs here. A SHA-keyed
  # group would collapse two events on one commit but could never cancel an older
  # commit's run, which is strictly worse.
  #
  # Bare name, not `github.head_ref || github.ref`: that form resolves to
  # `refs/heads/x` on a push and `x` on a pull_request, so the two never share a
  # group. It was applied here as a double-fire fix and did not work.
  # `github.ref_name` is already the short name on a push, and
  # `event.pull_request.head.ref` is the same short name on a PR.
  #
  # Honest scope: the trigger filter above is what this branch MEASURED as fixing
  # the duplicate. Since `push` can no longer target a PR branch, the two events
  # cannot collide here any more, so this expression's collapse behaviour is not
  # exercised by this configuration — it is belt-and-braces against the filter
  # being widened later, and against this file being copied as a template.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One gate, two versions: the floor declared in requires-python and the
  # current stable. Two entries, not a matrix sprawl.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: python -m pip install --upgrade build pillow

      # verify.sh IS the gate — test + build + install-smoke. CI runs exactly
      # what a developer runs locally, so green here means green there.
      - name: Verify
        run: |
          chmod +x verify.sh
          ./verify.sh

  # Dependency scanning. fx-dub ships ZERO runtime dependencies by design, so
  # this audits the build/test toolchain — the only place a CVE could reach us.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit build

      - name: Audit the build + test toolchain
        run: pip-audit --strict --progress-spinner=off

      # A regression here would be silent and expensive: an accidental
      # `dependencies = ["requests"]` would give a package documented as having
      # no network egress the ability to make one. Assert the list stays empty.
      # NOTE: this step uses tomllib (3.11+) and is safe only because this job
      # pins 3.12. Do NOT move it into the `verify` matrix, which includes the
      # 3.10 floor declared in requires-python — that exact mistake turned CI red
      # once already, with 3.12 green and 3.10 red on a ModuleNotFoundError.
      - name: Runtime dependency list must stay empty
        run: |
          python - <<'PY'
          import tomllib, sys
          deps = tomllib.load(open('pyproject.toml','rb'))['project'].get('dependencies', [])
          if deps:
              print(f"::error::fx-dub declares runtime dependencies: {deps}. "
                    "SECURITY.md promises none. Update both, deliberately, or drop the dep.")
              sys.exit(1)
          print("runtime dependencies: none, as documented")
          PY
